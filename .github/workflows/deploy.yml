# Builds the web app and publishes it to GitHub Pages.
# Runs on every push to main, every 6 hours, and hourly on game days, so NFLverse stats and Sleeper's player list stay fresh.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
    # Game days (Thu, Sun, Mon US time → UTC Thu–Tue): hourly, so prediction-market lines stay fresh.
    - cron: "47 * * * 0,1,2,4,5"
  workflow_dispatch:

permissions:
  contents: write   # to save weekly betting-line snapshots to the "history" branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore weekly-ranking snapshots already downloaded
        uses: actions/cache@v4
        with:
          path: .cache
          key: ecr-${{ github.run_id }}
          restore-keys: ecr-
      - name: Check out saved history (betting-line snapshots)
        run: |
          if git ls-remote --exit-code --heads origin history >/dev/null 2>&1; then
            git fetch --depth 1 origin history
            git worktree add history origin/history
          else
            mkdir -p history
          fi
      - name: Download and trim NFLverse + Sleeper player data
        run: npm run data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save betting-line snapshots to the history branch
        if: always()
        run: |
          cd history
          if [ ! -d .git ] && [ ! -f .git ]; then
            git init -q -b history && git remote add origin "$(git -C .. remote get-url origin)"
            git -C .. config --get http.https://github.com/.extraheader >/dev/null && git config http.https://github.com/.extraheader "$(git -C .. config --get http.https://github.com/.extraheader)"
          fi
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name="fantasy-hq-bot" -c user.email="actions@users.noreply.github.com" commit -q -m "Betting-line snapshots $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin HEAD:history
          fi
      - name: Build static site
        run: |
          export NEXT_PUBLIC_BASE_PATH="/${GITHUB_REPOSITORY#*/}"   # served at /<repo name>
          npm run build
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

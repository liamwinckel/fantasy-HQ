# Builds the web app and publishes it to GitHub Pages.
# Runs on every push to main, every 6 hours, and hourly on game days, so NFLverse stats and Sleeper's player list stay fresh.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
    # Game days (Thu, Sun, Mon US time → UTC Thu–Tue): hourly, so prediction-market lines stay fresh.
    - cron: "47 * * * 0,1,2,4,5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore weekly-ranking snapshots already downloaded
        uses: actions/cache@v4
        with:
          path: .cache
          key: ecr-${{ github.run_id }}
          restore-keys: ecr-
      - name: Download and trim NFLverse + Sleeper player data
        run: npm run data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build static site
        run: |
          export NEXT_PUBLIC_BASE_PATH="/${GITHUB_REPOSITORY#*/}"   # served at /<repo name>
          npm run build
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
